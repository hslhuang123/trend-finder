[server]
# Streamlit Community Cloud runs headless; this also matches local runs.
headless = true

[client]
# Hide the Streamlit hamburger/Deploy toolbar for a cleaner deployed app.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
# Match the app's accent colour (GitHub blue used across the screener).
primaryColor = "#0969da"
